[package]
name = "tiingo-mcp"
version = "2.2.0"
edition = "2024"
rust-version = "1.88"
description = "Tiingo MCP server for stock market data, forex, crypto, news, and fundamentals"
license = "MIT"
authors = ["Major 7 Apps"]
homepage = "https://github.com/major7apps/tiingo-mcp"
repository = "https://github.com/major7apps/tiingo-mcp"
keywords = ["mcp", "tiingo", "finance", "market-data", "stock-market"]
categories = ["command-line-utilities", "api-bindings"]
include = [
  "/src/**/*.rs",
  "/src/mcp/data/**/*.json",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[package.metadata.wix]
upgrade-guid = "18C7430E-C250-424A-BF8D-9EFFD8305628"
path-guid = "291E47C6-8EC5-4040-8661-88B2AA39E23E"
license = "LICENSE"
eula = false

[[bin]]
name = "tiingo-mcp"
path = "src/main.rs"

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
futures-util = "0.3"
httpdate = "1.0"
rand = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = { version = "1.0", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "macros", "server", "transport-child-process", "transport-io"] }
tokio = { version = "1.47", features = ["test-util"] }
wait-timeout = "0.2"
wiremock = "0.6"
